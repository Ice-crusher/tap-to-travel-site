<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
      }

      body {
        margin: 0;
        color: #202124;
        background: #f5f6f8;
      }

      main {
        box-sizing: border-box;
        width: min(880px, calc(100% - 32px));
        margin: 40px auto;
        padding: clamp(24px, 5vw, 56px);
        background: #ffffff;
        border: 1px solid #e2e5e9;
        border-radius: 14px;
        box-shadow: 0 8px 28px rgba(20, 24, 32, 0.07);
      }

      h1, h2, h3 {
        line-height: 1.25;
        color: #111827;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
      }

      h2 {
        margin-top: 2.2rem;
        padding-top: 0.35rem;
        border-top: 1px solid #e5e7eb;
      }

      h3 {
        margin-top: 1.6rem;
      }

      a {
        color: #2563eb;
      }

      code {
        padding: 0.12em 0.35em;
        border-radius: 4px;
        background: #eef1f5;
      }

      @media (max-width: 600px) {
        main {
          width: 100%;
          margin: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #d7dce3;
          background: #11151b;
        }

        main {
          background: #191f27;
          border-color: #303946;
          box-shadow: none;
        }

        h1, h2, h3 {
          color: #f3f4f6;
        }

        h2 {
          border-color: #303946;
        }

        a {
          color: #7db2ff;
        }

        code {
          background: #2a323e;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
